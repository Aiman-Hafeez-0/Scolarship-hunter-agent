[project]
name = "scholarship-hunter"
version = "0.1.0"
description = "Personal AI agent that tracks scholarship, admission and entry-test deadlines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.3.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.22",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "trafilatura>=2.3.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["pipeline/tests"]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]
