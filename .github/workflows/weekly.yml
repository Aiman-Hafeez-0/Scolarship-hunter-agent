name: Weekly run

# Runs on a schedule, and by hand: Actions tab > "Weekly run" > "Run workflow".
on:
  schedule:
    # TRIAL WEEK: every day at 03:17 UTC (08:17 PKT), to catch problems quickly.
    # After 27 Nov 2026, change this to "17 3 * * 1" (Mondays only, 08:17 PKT).
    # (Minute 17, not 0: GitHub's scheduler is busiest on the hour and may delay or skip runs.)
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-extract pages even if they did not change"
        type: boolean
        default: false
      provider:
        description: "LLM to use (auto = Gemini, then Groq if Gemini fails)"
        type: choice
        options: [auto, gemini, groq]
        default: auto
      send_digest:
        description: "Send the digest email after the run (it is always sent on Mondays)"
        type: boolean
        default: false

# The job only needs to read the code.
permissions:
  contents: read

# Never let two runs overlap (they would hit the same sites and LLM quotas twice).
concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # "shell: bash" turns on pipefail, so `... | tee` still fails the step if the command fails.
    defaults:
      run:
        shell: bash

    # The profile is already in the database, so profile.yaml is not needed here.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Email: MAIL_PROVIDER picks resend (also when it is empty) or gmail.
      MAIL_PROVIDER: ${{ secrets.MAIL_PROVIDER }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # Optional: only used when MAIL_PROVIDER is gmail.
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # The "browser" group adds Playwright, for sources with render_js: true.
      # Every `uv run` below names the same groups, so uv never removes it again.
      - name: Install dependencies
        run: uv sync --locked --no-dev --group pipeline --group browser

      # Chromium (about 100 MB) is downloaded once and kept in the cache until uv.lock
      # changes (a new Playwright version needs its own Chromium).
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: uv run --no-dev --group pipeline --group browser playwright install --with-deps --only-shell chromium

      # The system libraries Chromium needs are not in the cache, so they are added every run.
      - name: Install Chromium's system libraries
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: uv run --no-dev --group pipeline --group browser playwright install-deps chromium

      # Brings the database schema up to date (also the dashboard's login_failures table).
      # Safe every time: only new SQL files are applied.
      - name: Apply database migrations
        run: uv run --no-dev --group pipeline --group browser python -m pipeline.migrate

      # Inputs go through env variables, never pasted straight into the shell command.
      # A scheduled run has no inputs, so they fall back to the defaults.
      - name: Fetch, extract and save
        env:
          FORCE: ${{ inputs.force || 'false' }}
          PROVIDER: ${{ inputs.provider || 'auto' }}
        run: |
          args=(--provider "$PROVIDER")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          uv run --no-dev --group pipeline --group browser python -m pipeline.run weekly "${args[@]}" 2>&1 | tee weekly-summary.txt

      # Runs even if the weekly step failed, so matches are fresh for what was saved.
      - name: Match profiles
        if: ${{ !cancelled() }}
        run: uv run --no-dev --group pipeline --group browser python -m pipeline.run match 2>&1 | tee match-summary.txt

      # Monday is checked in UTC; at 03:17 UTC it is the same day in Pakistan (08:17 PKT).
      - name: Decide whether to send the digest
        id: digest
        if: ${{ !cancelled() }}
        env:
          SEND_DIGEST: ${{ inputs.send_digest || 'false' }}
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "$SEND_DIGEST" = "true" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "Not Monday and send_digest is off: no digest today."
          fi

      # Runs even if the weekly step failed: the digest then shows what was saved before.
      - name: Send digest
        if: ${{ !cancelled() && steps.digest.outputs.send == 'true' }}
        run: uv run --no-dev --group pipeline --group browser python -m pipeline.run digest 2>&1 | tee digest-summary.txt

      - name: Upload summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-summary
          path: |
            weekly-summary.txt
            match-summary.txt
            digest-summary.txt
          if-no-files-found: warn
          retention-days: 30
