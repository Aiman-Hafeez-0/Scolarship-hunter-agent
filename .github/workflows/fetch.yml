name: Fetch sources

# Manual only: run it from the Actions tab with "Run workflow".
on:
  workflow_dispatch:

# The job only needs to read the code.
permissions:
  contents: read

# Never let two fetch runs overlap (they would hit the same sites twice).
concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Fetch sources and save to the database
        run: uv run --no-dev python -m pipeline.run fetch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
