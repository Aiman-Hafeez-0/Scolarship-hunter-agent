<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"historyCacheSize": 0}'>
  <title>{% block title %}Scholarship Hunter{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style>
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline-flex; }
    .htmx-request #results, #results.htmx-request { opacity: .5; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen" hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  {% if user %}
  <nav class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-x-6 gap-y-2">
      <a href="/" class="font-semibold text-indigo-700">Scholarship Hunter</a>
      <a href="/" class="text-sm hover:underline">Home</a>
      <a href="/scholarships" class="text-sm hover:underline">Scholarships</a>
      <a href="/runs" class="text-sm hover:underline">Runs</a>
      <a href="/sources" class="text-sm hover:underline">Sources</a>
      <a href="/profile" class="text-sm hover:underline">Profile</a>
      <form method="post" action="/logout" class="sm:ml-auto">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="text-sm text-slate-600 hover:underline">Log out</button>
      </form>
    </div>
  </nav>
  {% endif %}

  <div id="htmx-error" role="alert" class="hidden max-w-6xl mx-auto mt-4 px-4">
    <div class="rounded border border-red-300 bg-red-50 text-red-800 px-4 py-3 text-sm">
      <span id="htmx-error-text">Something went wrong.</span>
      <button type="button" class="ml-2 underline" onclick="location.reload()">Reload</button>
    </div>
  </div>

  <main class="max-w-6xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <script>
    // Shows a red message when an HTMX request fails, and hides it when the next one starts.
    (function () {
      var box = document.getElementById("htmx-error");
      var text = document.getElementById("htmx-error-text");
      function show(message) { text.textContent = message; box.classList.remove("hidden"); }
      document.body.addEventListener("htmx:beforeRequest", function () { box.classList.add("hidden"); });
      document.body.addEventListener("htmx:responseError", function (e) {
        var status = e.detail.xhr.status;
        show(status === 503 ? "The database could not be reached. Try again in a minute."
             : status === 403 ? "This page has expired. Reload it and try again."
             : status === 404 ? "That item no longer exists. Reload the page."
             : "Something went wrong (error " + status + ").");
      });
      document.body.addEventListener("htmx:sendError", function () {
        show("No connection to the dashboard server.");
      });
      document.body.addEventListener("htmx:timeout", function () { show("The server took too long to answer."); });
    })();
  </script>
</body>
</html>
