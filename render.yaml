# Render Blueprint for the dashboard (Render > New > Blueprint > pick this repository).
#
# Values are never written here. "sync: false" makes Render ask for each one when you first
# create the Blueprint; later you change them under the service's Environment tab.
services:
  - type: web
    name: scholarship-hunter-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # Same region as the Supabase database (ap-southeast-1 = Singapore): every page reads
    # from it, so a far-away region makes each page slower.
    region: singapore
    healthCheckPath: /health
    envVars:
      # Supabase > Connect > Session pooler URI (Render cannot reach the IPv6-only direct one)
      - key: DATABASE_URL
        sync: false
      - key: DASHBOARD_EMAIL
        sync: false
      # From `uv run python -m app.hash_password` (the part after the = sign)
      - key: DASHBOARD_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        sync: false
      # Fine-grained token, this repository only, "Actions: Read and write"
      - key: RUN_NOW_GITHUB_TOKEN
        sync: false
      # owner/name
      - key: RUN_NOW_GITHUB_REPO
        sync: false
      - key: CONTACT_EMAIL
        sync: false
