# Pages the agent checks. Loaded and validated by pipeline/nodes/load_sources.py.
#
# Fields (see pipeline/models.py -> Source):
#   key               unique lowercase id, letters/digits/dashes (e.g. "turkiye-burslari")
#   name              human-friendly name
#   url               must start with https:// and be unique
#   program_key       groups pages about the same program (two pages can share one)
#   country           ISO-style code: TR, DE, IT, PK, EU, ...
#   type              official (the real owner, default) | lead (only points to the owner)
#   opportunity_type  scholarship | admission | entry_test
#   location          abroad | pakistan
#   render_js         true if the page needs a browser to show its content (default false)
#   is_pdf            true if the url is a PDF file (default false)
#   include_links     true = add the page's link/image URLs to its text, so a renamed file
#                     (e.g. a new calendar PDF) counts as a change (default false)
#   active            false = keep it listed but skip it for now (default true)
#   note              optional free text
#
# Example: adding one Erasmus Mundus program page (copy, uncomment, fix the url):
#
#   - key: emjmd-example-programme
#     name: Example Erasmus Mundus Joint Master
#     url: https://www.example-emjm.eu/admissions/
#     program_key: emjmd-example-programme
#     country: EU
#     opportunity_type: scholarship
#     location: abroad
#     note: Found via the Erasmus Mundus catalogue

